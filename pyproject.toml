[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reversesync"
version = "0.1.0"
description = "Write-back from Databricks Lakebase (Postgres) to Delta Lake: change table, unified view, CDF resolve, safe retirement"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Suriyalakshmi Chandrasekar" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
app = ["fastapi>=0.110", "psycopg[binary]>=3.1", "uvicorn>=0.29"]
spark = ["pyspark==3.5.3", "delta-spark==3.2.1"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
